# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  tree:
    desc: Prints Tree Structure of libs
    cmds:
      - clear
      - tree libs -L 2

  fresh-build-debug:
    desc: Fresh Build
    cmds:
      - clear
      - rm -rf build
      - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - cmake --build build
      - ctest --test-dir build -L "unit" --output-on-failure

  build-release:
    desc: Build in release mode
    cmds:
      - clear
      - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build build

  build-debug:
    desc: Build in debug mode
    cmds:
      - clear
      - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - cmake --build build

  test:
    desc: Test
    cmds:
      - clear
      - ctest --test-dir build -L "unit"

  run:
    desc: run main.wasp
    cmds:
      - clear
      - wasp run ./code/main.wasp

  play:
    desc: Compile and run a C file from ./play/ directory
    cmds:
      - clear
      - gcc -o ./play/{{.FILE}} ./play/{{.FILE}}.c && ./play/{{.FILE}}
    vars:
      FILE: '{{default "hello" .FILE}}'

  # ============================================
  # Linting & Formatting
  # ============================================

  fmt:
    desc: Format all C++ code with clang-format
    cmds:
      - find libs src tests -name "*.cpp" -o -name "*.h" -exec clang-format -i {} \;

  lint:
    desc: Run clang-tidy on all files
    cmds:
      - run-clang-tidy -p build -checks='*,-modernize-use-trailing-return-type,-llvm-header-guard'


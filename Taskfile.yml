# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  tree:
    desc: Prints Tree Structure of libs
    cmds:
      - clear
      - tree libs -L 2

  fresh:
    desc: Fresh Build
    cmds:
      - clear
      - rm -rf build
      - cmake -B build -G Ninja
      - cmake --build build
      - ctest --test-dir build -L "unit"

  build:
    desc: Build
    cmds:
      - clear
      - cmake --build build

  test:
    desc: Test
    cmds:
      - clear
      - ctest --test-dir build -L "unit"

  run:
    desc: run main.wasp
    cmds:
      - clear
      - wasp run ./code/main.wasp

